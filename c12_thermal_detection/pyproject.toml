[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c12_thermal_detection"
version = "1.0.0"
description = "Aerial thermal human detection application for Skydroid C12 and PX4 telemetry monitoring"
authors = [{ name = "Defense Aerial CV Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "PySide6>=6.5.0",
    "PyYAML>=6.0.0",
    "numpy>=1.23.0",
    "tqdm>=4.65.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

